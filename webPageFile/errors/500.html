<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>500 - Internal Server Error</title>

	<style>
		:root {
			--bg: #f6f1e7;
			--surface: #ffffff;
			--border: #e3d9c6;
			--text: #2a2520;
			--muted: #7c6f5d;
			--accent: #b4342a;
			--shadow: 0 1px 2px rgba(42, 37, 32, .06), 0 8px 24px rgba(42, 37, 32, .07);
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #17150f;
				--surface: #221f17;
				--border: #3a342a;
				--text: #f0e9dc;
				--muted: #a1937c;
				--accent: #f08a80;
				--shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1.5rem;

			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			line-height: 1.6;
			-webkit-font-smoothing: antialiased;
		}

		.card {
			width: min(480px, 100%);
			text-align: center;
			padding: 2.75rem 2rem 2.25rem;

			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 14px;
			box-shadow: var(--shadow);
		}

		.code {
			margin: 0;
			font-size: clamp(3.5rem, 14vw, 5rem);
			font-weight: 800;
			line-height: 1;
			letter-spacing: -.04em;
			color: var(--accent);
		}

		h1 {
			margin: .6rem 0 0;
			font-size: 1.25rem;
			letter-spacing: -.01em;
		}

		p {
			margin: .7rem 0 0;
			color: var(--muted);
			font-size: .93rem;
		}

		a {
			display: inline-block;
			margin-top: 1.8rem;
			padding: .6rem 1.3rem;

			background: transparent;
			border: 1px solid var(--border);
			color: var(--text);
			font-weight: 600;
			font-size: .9rem;
			text-decoration: none;
			border-radius: 10px;
			transition: border-color .15s ease;
		}

		a:hover {
			border-color: var(--accent);
		}

		.served {
			margin-top: 1.7rem;
			padding-top: 1.1rem;
			border-top: 1px solid var(--border);

			color: var(--muted);
			font-size: .76rem;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		}
	</style>
</head>

<body>
	<main class="card">
		<p class="code">500</p>
		<h1>Internal Server Error</h1>
		<p>Something went wrong while handling this request. Please try again later.</p>

		<a href="/">Return home</a>

		<p class="served">served by The Tonton Webserv</p>
	</main>
</body>

</html>
